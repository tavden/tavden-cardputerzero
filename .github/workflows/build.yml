name: Build and verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  desktop:
    name: Linux simulator and tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools and libraries
        run: |
          python3 -m pip install --user "cmake>=3.31,<5"
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev libfreetype-dev libpng-dev libjpeg-dev zlib1g-dev libfmt-dev

      - name: Configure and build
        run: |
          cmake --preset linux-x86-64
          cmake --build --preset linux-x86-64-rel --parallel 2

      - name: Test
        run: ctest --test-dir build/linux-x86-64 -C Release --output-on-failure

      - name: Verify privacy-safe screenshots
        run: |
          env SDL_VIDEODRIVER=dummy TAVDEN_DEMO_MODE=1 TAVDEN_CAPTURE_SCREENSHOT="$PWD/screenshot/tavden-zero-overview.png" ./build/linux-x86-64/Release/tavden-cardputerzero
          env SDL_VIDEODRIVER=dummy TAVDEN_DEMO_MODE=1 TAVDEN_START_PAGE=system TAVDEN_CAPTURE_SCREENSHOT="$PWD/screenshot/tavden-zero-system.png" ./build/linux-x86-64/Release/tavden-cardputerzero
          env SDL_VIDEODRIVER=dummy TAVDEN_DEMO_MODE=1 TAVDEN_START_PAGE=network TAVDEN_CAPTURE_SCREENSHOT="$PWD/screenshot/tavden-zero-network.png" ./build/linux-x86-64/Release/tavden-cardputerzero
          file screenshot/tavden-zero-*.png | tee /tmp/tavden-screenshot-info.txt
          test "$(grep -c '320 x 170' /tmp/tavden-screenshot-info.txt)" -eq 3

  cardputerzero:
    name: CardputerZero ARM64 package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install cross-build tools
        run: |
          python3 -m pip install --user "cmake>=3.31,<5"
          sudo apt-get update
          sudo apt-get install -y ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Build and package
        run: cmake --workflow --preset cp0-cross-package

      - name: Verify package
        run: |
          file build/cp0-cross/Release/tavden-cardputerzero
          file build/cp0-cross/Release/tavden-cardputerzero | grep -q 'ARM aarch64'
          dpkg-deb -f dist/tavden-cardputerzero_*_arm64.deb Package Version Architecture Maintainer
          test "$(dpkg-deb -f dist/tavden-cardputerzero_*_arm64.deb Architecture)" = arm64
          if dpkg-deb -c dist/tavden-cardputerzero_*_arm64.deb | grep -Eq 'systemd|[.]service$'; then
            echo "Unexpected systemd service in package"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: tavden-zero-arm64
          path: dist/tavden-cardputerzero_*_arm64.deb
          if-no-files-found: error
